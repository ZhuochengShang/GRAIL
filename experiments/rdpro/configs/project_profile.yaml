    vector_shx_sha256: ed102bdd96060de98de2d6039aae78b0a00805d5d680947f2bd4ddcd03e0bd6b
    vector_prj_sha256: a02a27b1d1982c8516d83398e85a3c8b1aef1713c13ef4d84d7bde17430c07c4
