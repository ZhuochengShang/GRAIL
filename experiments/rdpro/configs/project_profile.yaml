# Project profile — fill this in BEFORE running AIDEAL's LLM steps.
# `role`: the expertise persona the agent should adopt (injected first into
# every prompt), e.g. "an expert in geospatial raster pipelines on Spark".
role: >
  an expert in geospatial raster processing and Spark pipelines using RDPro/Beast.
  You know the user-facing raster operations (load/transform/join/zonal-stats/
  reshape/reproject/save) versus internal plumbing (tiles, readers, writers,
  iterators, serializers), and you write idiomatic, runnable RDPro Scala.
project:
  name: RDPro
  language: Scala
  description: >
    A Spark-based distributed raster processing library (part of UCR Beast)
    for large-scale geospatial analysis: loading GeoTIFFs, per-pixel
    transforms, raster-vector joins, dataset alignment, and zonal statistics.

provenance:
  upstream: git@bitbucket.org:bdlabucr/beast.git
  release: beast-0.10.1
  revision: 547f7f912131a8032f6b5d26991415a5faf05cef
  protocol:
    id: rdpro-2x2-v2-shared88-relevant
    manifest: docs/api_manifest_shared.json
    manifest_api_count: 88
    manifest_inventory_sha256: 1dc1f1c758ae9829c2654e853899603f12f1d7174afdfeffd9edd1f29dde14e1
    document_scope: relevant
    final_snippet_fix_rounds: 0
  fixtures:
    raster_vector_source: canonical GRAIL experiment fixtures (read-only)
    hdf_source: pinned Beast upstream test resources
    raster_tif_sha256: d1583296084ff5511743f4b3c0cf6307313e436410771503e42e097c94e8f407
    vector_shp_sha256: 2595d72266b1b3decdb8989e679d093996240cf4b891b3c09f37d9372a6a6cd6
