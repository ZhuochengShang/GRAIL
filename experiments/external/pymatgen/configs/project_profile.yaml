project_name: pymatgen
project:
  name: pymatgen
  language: Python
  description: >-
    A scientific Python library for materials analysis, simulation I/O, and
    higher-level structure, thermodynamics, and electronic-structure workflows.
domain: >-
  Materials-science analysis in Python, including crystal structures,
  molecules, phase diagrams, reactions, local environments, surfaces,
  interfaces, electronic structure, and simulation-code file formats.
target_users:
  - computational materials scientists and chemists
  - scientific Python developers building materials-analysis workflows
  - coding agents composing pymatgen analyses from natural-language tasks
use_cases:
  - Construct and transform crystal structures and molecular representations.
  - Analyze phase stability, reactions, surfaces, interfaces, and bonding.
  - Parse and summarize outputs from electronic-structure codes.
  - Compute deterministic properties from small bundled or in-memory examples.
constraints:
  - Do not query Materials Project or other network services.
  - Prefer small in-memory structures and repository test fixtures.
  - Account for the 2026 split that moved core objects to pymatgen-core.
notes: >-
  Cross-language AIDEAL target. The upstream AGENTS.md is retained as a
  separate strong-baseline document and is not fed into README generation.
