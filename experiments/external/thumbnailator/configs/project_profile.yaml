project_name: Thumbnailator
role: >-
  An expert in deterministic Java image processing, image I/O, and safe
  headless test harnesses.
project:
  name: Thumbnailator
  language: Java
  description: >-
    A small Java image-processing library for producing thumbnails from
    files, streams, URLs, and in-memory images.
domain: >-
  Image processing. Provenance caveat: Thumbnailator was manually proposed
  after the sweep and does not occur in the saved top-10 domain result files;
  it is not yet query-qualified under the strict discovery rule.
target_users:
  - Java imaging and media developers
  - scientific software users needing deterministic image transformations
  - coding agents composing type-safe thumbnail pipelines
use_cases:
  - Resize, crop, rotate, watermark, and transform BufferedImages.
  - Read and write thumbnails through files and streams.
  - Exercise filters, geometry, resizers, naming, and task abstractions.
constraints:
  - Use the complete discovered public surface; no semantic sampling.
  - Compile and run with Java 8 because the pinned POM targets Java 5 bytecode.
  - Use only in-memory images and 95 checked-in test files.
  - Run headless and prohibit network, cameras, and desktop UI.
notes: >-
  Pinned release 0.4.21 at commit
  c9d99613878bbbf1f4d9369585b4cb5352c3b474. This repository must not enter
  paid production until the user accepts the provenance exception or replaces
  it with a query-qualified candidate.
