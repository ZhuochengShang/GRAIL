project_name: mir_eval
role: >-
  An expert in reproducible music-information-retrieval evaluation and
  scientific Python API usage.
project:
  name: mir_eval
  language: Python
  description: >-
    A scientific Python library of evaluation metrics, I/O helpers, displays,
    and sonification utilities for music and audio information retrieval.
domain: >-
  Audio and music signal evaluation. This label is query provenance, not a
  manual classification: the repository was returned by both the saved
  "audio processing" and "signal processing" GitHub sweeps.
target_users:
  - music-information-retrieval researchers
  - audio and signal-processing engineers
  - coding agents implementing reproducible metric evaluations
use_cases:
  - Score beats, onsets, melody, multipitch, chords, keys, and tempo.
  - Evaluate segment, hierarchy, transcription, alignment, and separation outputs.
  - Load repository-format annotations and produce deterministic summaries.
constraints:
  - Use the complete 148-name AIDEAL-discovered public surface; no sampling.
  - Use Python 3.10, the supported runtime that passes stored image baselines.
  - Use only checked-in test fixtures or deterministic in-memory arrays.
  - Keep display tests headless and prohibit network/audio-device access.
notes: >-
  Pinned source commit fe73b3533737814f83dbd9739f06e90f5f82f758.
  The repository includes 387 checked-in files under tests/data.
