extends: [python]

project:
  name: mir_eval
  language: Python

codebase:
  source_globs:
    - "source/mir_eval/**/*.py"
  test_globs:
    - "source/tests/**/*.py"
  surface_filter: all

files:
  project_profile: configs/project_profile.yaml
  original_readme:
    - source/README.rst
    - source/docs
  llm_readme: docs/LLM_readme.md
  notes_to_self: docs/notes_to_self.md
  integration_tasks: configs/integration_tasks.yaml
  aliases: aliases/aliases.json
  error_log: logs/error_log.jsonl

models:
  registry:
    gemini-3.1-pro: { provider: google, model: gemini-3.1-pro-preview }
  roles:
    author: gemini-3.1-pro
    audience: gemini-3.1-pro
    fixer: gemini-3.1-pro

comprehension:
  class_context: false
  relevant_doc_chars: 12000
  execute:
    scaffold: docs/api_test_scaffold.py
    test_filename: api_test.py
    region: ["# TODO API_TEST_START", "# TODO API_TEST_END"]
    command: >-
      env MPLBACKEND=Agg OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
      {root}/source/.venv/bin/python {test_file}
    local_uris: false
    output_dir: /tmp/aideal_mir_eval_out
    preamble: |
      times = np.array([0.0, 0.5, 1.0, 1.5, 2.0])  # type: numpy.ndarray event/frame times
      ref_events = np.array([0.0, 0.5, 1.0, 1.5])  # type: numpy.ndarray reference events
      est_events = np.array([0.02, 0.48, 1.03, 1.52])  # type: numpy.ndarray estimated events
      ref_intervals = np.array([[0.0, 0.5], [0.5, 1.0], [1.0, 1.5], [1.5, 2.0]])  # type: numpy.ndarray reference intervals
      est_intervals = np.array([[0.0, 0.48], [0.48, 1.02], [1.02, 1.48], [1.48, 2.0]])  # type: numpy.ndarray estimated intervals
      ref_labels = ["C:maj", "G:maj", "A:min", "F:maj"]  # type: list[str] reference labels
      est_labels = ["C:maj", "G:maj", "A:min", "F:maj"]  # type: list[str] estimated labels
      ref_freqs = np.array([440.0, 440.0, 0.0, 523.25, 523.25])  # type: numpy.ndarray reference frequencies
      est_freqs = np.array([442.0, 438.0, 0.0, 525.0, 520.0])  # type: numpy.ndarray estimated frequencies
      ref_sources = np.vstack([np.sin(2*np.pi*3*times), np.cos(2*np.pi*2*times)])  # type: numpy.ndarray reference sources
      est_sources = ref_sources + 0.001  # type: numpy.ndarray estimated sources
    sample_data:
      beat_reference_file: source/tests/data/beat/ref00.txt
      beat_estimate_file: source/tests/data/beat/est00.txt
      chord_reference_file: source/tests/data/chord/ref00.lab
      melody_reference_file: source/tests/data/melody/ref00.txt
    max_fix_rounds: 0
    require_correctness: true
    timeout_seconds: 300
    success_marker: __DONE__
    error_marker: __RUN_ERR__
    execution_context: >-
      A runnable headless Python harness is already in scope. Write statements
      only for the marked function body. Reuse the small arrays, labels, and
      repository fixture paths already defined; import the target from its
      public mir_eval module, call it, validate a deterministic property with
      assert, and print a compact witness. Do not download or play audio.
    exec_hints: >-
      mir_eval functions generally accept NumPy event times, intervals,
      labels, frequencies, or source matrices. Keep plotting headless. For I/O
      functions use only the configured files under source/tests/data. Avoid
      deprecated aliases when the documented public function is available.

docfix:
  allowed_member_categories: [language_core, python_core]
