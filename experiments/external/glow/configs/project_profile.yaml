project_name: Glow
project:
  name: Glow
  language: Scala
  description: >-
    An open-source Spark toolkit for scalable genomic data processing and
    association analysis.
domain: >-
  Large-scale genomics on Apache Spark: variant data ingestion, quality
  control, normalization, liftover, association studies, and scalable
  bioinformatics transformations over Spark DataFrames.
target_users:
  - bioinformatics engineers processing cohort-scale genomic data
  - computational geneticists building reproducible Spark workflows
  - coding agents translating genomics tasks into Glow and Spark APIs
use_cases:
  - Read VCF, BGEN, or PLINK data into Spark DataFrames.
  - Normalize and split genomic variants and perform coordinate liftover.
  - Compute sample and variant quality-control statistics.
  - Run linear or logistic genome-wide association analyses.
constraints:
  - Prefer public io.projectglow APIs and Spark SQL functions.
  - Keep examples local and deterministic; do not require Databricks services.
  - Use tiny bundled test fixtures for later execution experiments.
notes: >-
  Same-stack/different-domain AIDEAL generalization target. The first pass
  evaluates automatic README generation before any project-specific repair.
