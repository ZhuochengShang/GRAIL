comprehension:
  execute:
    execution_context: A runnable headless Python harness is already in scope. Write
      statements only for the marked function body. Reuse the small arrays, labels,
      and repository fixture paths already defined; import the target from its public
      mir_eval module, call it, validate a deterministic property with assert, and
      print a compact witness. Do not download or play audio.
    region:
    - '# TODO API_TEST_START'
    - '# TODO API_TEST_END'
    strip_snippet_imports: false
    output_tail_chars: 2000
    success_marker: __DONE__
    error_marker: __RUN_ERR__
    work_dir: .aideal_exec/A2
    timeout_seconds: 300
    max_fix_rounds: 0
    auto_report: true
    test_filename: api_test.py
    command: env MPLBACKEND=Agg OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 {root}/source/.venv/bin/python
      {test_file}
    exec_hints: mir_eval functions generally accept NumPy event times, intervals,
      labels, frequencies, or source matrices. Keep plotting headless. For I/O functions
      use only the configured files under source/tests/data. Avoid deprecated aliases
      when the documented public function is available.
    scaffold: docs/api_test_scaffold.py
    local_uris: false
    output_dir: .aideal_exec/A2/output
    preamble: 'times = np.array([0.0, 0.5, 1.0, 1.5, 2.0])  # type: numpy.ndarray
      event/frame times

      ref_events = np.array([0.0, 0.5, 1.0, 1.5])  # type: numpy.ndarray reference
      events

      est_events = np.array([0.02, 0.48, 1.03, 1.52])  # type: numpy.ndarray estimated
      events

      ref_intervals = np.array([[0.0, 0.5], [0.5, 1.0], [1.0, 1.5], [1.5, 2.0]])  #
      type: numpy.ndarray reference intervals

      est_intervals = np.array([[0.0, 0.48], [0.48, 1.02], [1.02, 1.48], [1.48, 2.0]])  #
      type: numpy.ndarray estimated intervals

      ref_labels = ["C:maj", "G:maj", "A:min", "F:maj"]  # type: list[str] reference
      labels

      est_labels = ["C:maj", "G:maj", "A:min", "F:maj"]  # type: list[str] estimated
      labels

      ref_freqs = np.array([440.0, 440.0, 0.0, 523.25, 523.25])  # type: numpy.ndarray
      reference frequencies

      est_freqs = np.array([442.0, 438.0, 0.0, 525.0, 520.0])  # type: numpy.ndarray
      estimated frequencies

      ref_sources = np.vstack([np.sin(2*np.pi*3*times), np.cos(2*np.pi*2*times)])  #
      type: numpy.ndarray reference sources

      est_sources = ref_sources + 0.001  # type: numpy.ndarray estimated sources

      '
    sample_data:
      beat_reference_file: source/tests/data/beat/ref00.txt
      beat_estimate_file: source/tests/data/beat/est00.txt
      chord_reference_file: source/tests/data/chord/ref00.lab
      melody_reference_file: source/tests/data/melody/ref00.txt
    require_correctness: true
  class_context: false
  relevant_doc_chars: 12000
project:
  language: Python
  name: mir_eval
extends:
- python
- aideal.yaml
