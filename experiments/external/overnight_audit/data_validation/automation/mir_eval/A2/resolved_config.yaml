codebase:
  intent:
    weights: {}
    manual_include: []
    manual_exclude: []
    exclude_name_patterns: []
    use_llm: false
    refresh_llm: false
  intended_api:
    static_include_threshold: 8
    static_exclude_threshold: 1
    batch_size: 25
    cache: docs/intended_api_decisions.json
    refresh: false
  public_def_regex: ^\s*(?:def|class)\s+([A-Za-z][A-Za-z0-9_]*)
  exclude_names:
  - main
  - setup
  source_globs:
  - source/mir_eval/**/*.py
  test_globs:
  - source/tests/**/*.py
  surface_filter: all
files:
  project_profile: configs/project_profile.yaml
  prompts_dir: prompts
  llm_readme: docs/eval/A2/LLM_readme.md
  notes_to_self: docs/notes_to_self.md
  integration_tasks: configs/integration_tasks.yaml
  aliases: aliases/aliases.json
  error_log: logs/A2/error_log.jsonl
  original_readme:
  - source/README.rst
  - source/docs
models:
  registry:
    gpt-4o:
      provider: openai
      model: gpt-4o
    gpt-4o-mini:
      provider: openai
      model: gpt-4o-mini
    codex-5.3:
      provider: codex
      model: gpt-5.3-codex
    gemini-2.5-pro:
      provider: google
      model: gemini-2.5-pro
    gemini-3.1-pro:
      provider: google
      model: gemini-3.1-pro-preview
    gemini-3.2-pro:
      provider: google
      model: gemini-3.2-pro-preview
    claude-sonnet:
      provider: anthropic
      model: claude-sonnet-4-6
    qwen:
      provider: ollama
      model: qwen3:32b
    llama3:
      provider: ollama
      model: llama3
  roles:
    author: gemini-3.1-pro
    audience: gemini-3.1-pro
    fixer: gemini-3.1-pro
runtime:
  target: local
  local: {}
checks:
  required_sections:
  - Signature
  - Goal
  - Parameters
  - Input
  - Output
  - Valid Call Patterns|Valid Access Patterns
  - LLM Instruction Prompt
  - Prompt Snippet
  - Common Failure Modes
  - Fix Code Hint
  comprehension_apis_sampled: 5
