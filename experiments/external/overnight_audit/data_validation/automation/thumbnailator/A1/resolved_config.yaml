codebase:
  intent:
    weights: {}
    manual_include: []
    manual_exclude: []
    exclude_name_patterns: []
    use_llm: false
    refresh_llm: false
  intended_api:
    static_include_threshold: 8
    static_exclude_threshold: 1
    batch_size: 25
    cache: docs/intended_api_decisions.json
    refresh: false
  public_def_regex: ^\s*(?:(?:(?:public|protected|private|static|final|abstract|synchronized|native|strictfp|default)\s+)+(?:<[^>{};]+>\s+)?(?:[A-Za-z_$][A-Za-z0-9_$.?]*(?:<[^>{};]+>)?(?:\[\])*\s+)?|(?!(?:if|for|while|switch|return|throw|new|assert)\b)(?:<[^>{};]+>\s+)?[A-Za-z_$][A-Za-z0-9_$.?]*(?:<[^>{};]+>)?(?:\[\])*\s+)([A-Za-z_$][A-Za-z0-9_$]*)\s*(?=\()
  exclude_names:
  - main
  - toString
  - equals
  - hashCode
  - clone
  - finalize
  source_globs:
  - source/src/main/java/**/*.java
  test_globs:
  - source/src/test/java/**/*.java
  surface_filter: all
files:
  project_profile: configs/project_profile.yaml
  prompts_dir: prompts
  llm_readme: docs/eval/A1/LLM_readme.md
  notes_to_self: docs/notes_to_self.md
  integration_tasks: configs/integration_tasks.yaml
  aliases: aliases/aliases.json
  error_log: logs/A1/error_log.jsonl
  original_readme:
  - source/README.md
  - source/target/site/apidocs
