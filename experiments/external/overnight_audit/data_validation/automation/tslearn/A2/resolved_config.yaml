comprehension:
  execute:
    execution_context: A headless Python harness, balanced eight-series training data,
      a second series set, one-dimensional signals, labels, a small numeric matrix,
      repository fixture paths, and a pre-created condition-specific output directory
      are already in scope. Import the target explicitly.
    region:
    - '# TODO API_TEST_START'
    - '# TODO API_TEST_END'
    strip_snippet_imports: false
    output_tail_chars: 4000
    success_marker: __DONE__
    error_marker: __RUN_ERR__
    work_dir: .aideal_exec/A2
    timeout_seconds: 300
    max_fix_rounds: 0
    auto_report: true
    test_filename: api_test.py
    command: env PYTHONPATH=../../tslearn PYTHONHASHSEED=0 MPLBACKEND=Agg NUMBA_THREADING_LAYER=workqueue
      NUMBA_NUM_THREADS=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
      /Users/clockorangezoe/miniconda3/envs/geo_llm_spark/bin/python {test_file}
    exec_hints: Use small deterministic parameters. For file-writing APIs, write only
      below output_dir. Optional-dependency failures must remain explicit infrastructure
      outcomes. End with a meaningful assertion and print a compact __CHECK__ witness.
    scaffold: docs/api_test_scaffold_full235.py
    preamble: 'Path(output_dir).mkdir(parents=True, exist_ok=True)

      _trace = np.load(trace_npz)

      _balanced = np.array([0, 4, 1, 17, 3, 13, 2, 5], dtype=int)

      X = _trace["X_train"][_balanced, :40, :]  # type: balanced time-series dataset
      ndarray (8, 40, 1)

      X2 = _trace["X_test"][:4, :32, :]  # type: second dataset ndarray (4, 32, 1)

      s1 = X[0].ravel()  # type: 1-D series ndarray (40,)

      s2 = X[1].ravel()  # type: 1-D series ndarray (40,)

      y = _trace["y_train"][_balanced]  # type: four balanced labels, two examples
      per class

      tiny_matrix = np.arange(12.0).reshape(3, 4)  # type: deterministic numeric matrix

      '
    sample_data:
      trace_npz: tslearn/tslearn/.cached_datasets/Trace.npz
    require_correctness: true
    io_hints: ''
    local_uris: false
    output_dir: .aideal_exec/A2/output
  class_context: false
  relevant_doc_chars: 12000
