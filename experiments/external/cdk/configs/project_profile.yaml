project_name: CDK
project:
  name: CDK
  language: Java
  description: >-
    A modular Java library for representing, reading, searching, analyzing,
    and depicting chemical structures and reactions.
domain: >-
  Cheminformatics and bioinformatics in Java: molecular and reaction models,
  chemical file formats, aromaticity and ring algorithms, fingerprints,
  substructure/SMARTS search, descriptors, coordinates, and rendering.
target_users:
  - cheminformatics researchers and scientific Java developers
  - developers embedding chemical structure processing in applications
  - coding agents composing CDK workflows from natural-language tasks
use_cases:
  - Parse SMILES or structure files into molecular object models.
  - Generate canonical SMILES and molecular fingerprints.
  - Perceive aromaticity, rings, and molecular connectivity.
  - Run SMARTS/substructure matching and calculate molecular descriptors.
constraints:
  - Use public org.openscience.cdk APIs and small in-memory molecules.
  - Avoid GUI, network services, and external chemistry databases.
  - Treat README generation as supported; execution awaits Maven harness wiring.
notes: >-
  Third-language AIDEAL target. Javadocs and JUnit tests provide the static
  grounding evidence for the first generated-README pilot.
