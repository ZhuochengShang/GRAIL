role: >-
  an expert molecular-simulation researcher and scientific Python engineer
  using MDAnalysis for reproducible trajectory and structure analysis.
project:
  name: MDAnalysis
  language: Python
  description: >-
    MDAnalysis 2.9.0, an object-oriented scientific Python library for reading molecular
    structures and trajectories, selecting atoms, transforming coordinates,
    and running molecular-dynamics analyses.
domain: >-
  Molecular-dynamics trajectory and structural analysis in Python, including
  topology/coordinate I/O, atom selections, geometric measurements, trajectory
  transformations, and reusable analysis algorithms.
target_users:
  - computational chemists and molecular-simulation researchers
  - scientific Python developers analyzing proteins and materials
use_cases:
  - Load a topology and trajectory into a Universe and select atoms.
  - Compute structural properties such as centers of mass and radii of gyration.
  - Iterate over trajectory frames and analyze changing coordinates.
  - Run RMSD, distance, contact, and other MDAnalysis.analysis workflows.
constraints:
  - A Universe owns topology and trajectory state.
  - AtomGroup methods operate on selected atoms at the current trajectory frame.
  - Analysis classes generally require construction followed by run().
  - Use only fixtures from the pinned, checked-in MDAnalysisTests 2.9.0 testsuite data directory; never substitute downloaded data.
  - The PSF/DCD pair is preloaded for general trajectory analysis; format-specific APIs may use the matching PDB, GRO, XTC, or another checked-in file exposed through mdanalysis_fixture_dir.
  - Some readers and converters require optional dependencies; a missing optional package is an infrastructure outcome, not evidence that the documentation is wrong.
  - The adk_dims.dcd trajectory has no periodic box dimensions; use a checked-in periodic fixture when an API requires periodic boundaries.
  - Do not download data, invoke a GUI, or write large trajectories.
