project_name: tslearn
role: >-
  An expert Python time-series machine-learning engineer using tslearn and
  scikit-learn conventions. Write small deterministic executable checks for
  every discovered public API identity, including low-level backend helpers.
project:
  name: tslearn
  language: Python
  description: >-
    A scientific machine-learning toolkit for time-series data, including
    distance and alignment metrics, clustering, classification, forecasting,
    barycenters, preprocessing, shapelets, serialization, and backend helpers.
domain: time-series machine learning
domain_query_provenance: >-
  Pre-existing AIDEAL study target; not selected by the 2026-09-06
  cross-domain GitHub query sweep.
target_users:
  - time-series researchers and data scientists
  - ML engineers familiar with NumPy and scikit-learn
  - coding agents generating executable time-series workflows
use_cases:
  - Compute time-series distances, similarities, alignments, and barycenters.
  - Train compact clustering, classification, and forecasting estimators.
  - Convert, normalize, resample, serialize, and inspect time-series datasets.
  - Exercise public NumPy and PyTorch backend helpers with small arrays.
constraints:
  - Test every name in the frozen 235-name corrected raw public surface; never sample.
  - Use only the checked-in Trace fixture and deterministic in-memory derivatives.
  - Do not download datasets, plot interactively, or access the network.
  - Keep estimator sizes, iteration counts, and thread counts small.
  - Import the target explicitly; the shared scaffold does not pre-import tested APIs.
  - Assert a falsifiable property and print the configured correctness witness.
